<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca de Atención · Centro de Soporte SEA / MARN</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--navy:#0F1E5B;--blue:#1746C8;--bg:#C7CCD6;--ink:#0F1E5B;--muted:#5a6378;
        --consulta:#1746C8;--gestion:#1A7F47;--incidencia:#B91C1C;}
  body{background:var(--bg);font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh}
  .wrap{max-width:1040px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:10px;padding:14px 18px;position:sticky;top:0;background:var(--bg);z-index:5}
  .navbtn{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(15,30,91,.25);flex:0 0 auto}
  .navbtn:hover{background:var(--blue)}
  .navbtn[disabled]{opacity:.35;cursor:default}
  .top .title{flex:1;text-align:center;font-weight:900;font-size:20px;letter-spacing:.02em;color:var(--navy);text-transform:uppercase}
  .phone{width:34px;height:34px;color:var(--navy);flex:0 0 auto}
  .content{flex:1;padding:8px 22px 40px}
  .cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:18px}
  .cover h1{font-size:38px;font-weight:900;color:var(--navy);line-height:1.1}
  .cover .sub{font-size:14px;font-weight:700;letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
  .cover p{max-width:560px;color:var(--muted);font-size:14px;line-height:1.5}
  .btn-start{margin-top:6px;background:var(--navy);color:#fff;border:none;border-radius:30px;padding:14px 46px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(15,30,91,.3)}
  .btn-start:hover{background:var(--blue)}
  .logo-badge{width:92px;height:92px;border-radius:24px;background:linear-gradient(135deg,#0F1E5B,#2A6BFF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:28px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:6px}
  .grid.g1{grid-template-columns:1fr}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .card{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 4px 14px rgba(15,30,91,.10);cursor:pointer;border-left:5px solid var(--blue);transition:transform .08s, box-shadow .08s;display:flex;flex-direction:column;gap:4px}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,30,91,.16)}
  .card .ct{font-weight:800;font-size:15.5px;color:var(--navy);line-height:1.2}
  .card .cd{font-size:12px;color:var(--muted);line-height:1.35}
  .card.consulta{border-left-color:var(--consulta)} .card.gestion{border-left-color:var(--gestion)} .card.incidencia{border-left-color:var(--incidencia)}
  .card.big{padding:22px;align-items:flex-start}
  .card.big .ct{font-size:18px} .card.big .q{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:2px}
  .card.tool{border-left-color:#7C3AED;background:#fbfbfe}
  .card.tool .ct{font-size:13.5px}
  .lead{font-size:13.5px;color:var(--muted);margin:2px 0 14px;line-height:1.5}
  .lead b{color:var(--navy)}
  .subhdr{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
  .crumb{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px}
  .chip{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;color:#fff}
  .chip.consulta{background:var(--consulta)} .chip.gestion{background:var(--gestion)} .chip.incidencia{background:var(--incidencia)}
  .sec-title{font-size:22px;font-weight:900;color:var(--navy);margin:2px 0 4px;line-height:1.15}
  .guion{background:#fff;border-radius:14px;padding:16px 20px;box-shadow:0 4px 14px rgba(15,30,91,.10);margin-top:10px}
  .guion .lbl{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
  .guion .txt{font-size:14.5px;line-height:1.55;color:#1d2a52}
  .casebox{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:8px}
  .btn-next{margin-top:16px;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:13px 26px;font-size:15px;font-weight:800;cursor:pointer}
  .btn-next:hover{background:var(--blue)}
  .decide{display:flex;gap:14px;margin:16px 0 6px}
  .dbtn{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;color:#fff;cursor:pointer}
  .dbtn.yes{background:#16A34A} .dbtn.yes:hover{background:#15803D}
  .dbtn.no{background:#DC2626} .dbtn.no:hover{background:#B91C1C}
  .tipi{background:#EAF0FB;border:1.5px solid #C5D4F2;border-radius:14px;padding:14px 18px;margin-top:14px}
  .tipi h4{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
  .tipi .route{font-size:14px;font-weight:800;color:var(--navy);line-height:1.5}
  .tipi .route span{color:var(--muted);font-weight:600}
  .tipi .meta{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}
  .ref{font-size:11.5px;color:var(--muted);margin-top:10px}
  .search-in{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #C5D4F2;font-size:15px;outline:none;background:#fff}
  .search-in:focus{border-color:var(--blue)}
  .res{background:#fff;border-radius:10px;padding:11px 14px;box-shadow:0 3px 10px rgba(15,30,91,.08);cursor:pointer;margin-top:8px;display:flex;flex-direction:column;gap:3px}
  .res:hover{box-shadow:0 6px 16px rgba(15,30,91,.14)}
  .res .rt{font-weight:800;font-size:13.5px;color:var(--navy)}
  .res .rc{font-size:11.5px;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin-top:10px}
  .ov{position:fixed;inset:0;background:rgba(20,30,70,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:30}
  .modal{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:26px 28px;box-shadow:0 18px 50px rgba(0,0,0,.3);position:relative;max-height:86vh;overflow:auto}
  .modal h3{color:var(--navy);font-size:18px;margin-bottom:10px}
  .modal .txt{font-size:14px;line-height:1.55;color:#1d2a52}
  .mx{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;border:none;font-size:16px;cursor:pointer}
  .note{background:#FFF7E6;border-left:4px solid #F59E0B;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#6b4e16;line-height:1.45;margin-top:12px}
  a.card{text-decoration:none}
  .foot{text-align:center;font-size:11px;color:var(--muted);padding:14px}
</style>
</head>

iones y de declaración jurada, presionar \"Finalizar trámite\" y luego \"Enviar a revisión\".", "script": "Sí · Finalizar y enviar trámite", "brochure": "46–59 (Finalizar y seguimiento del trámite)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Trámite ambiental", "t3": "Pasos del trámite (INA, ISA, PIA)", "caso": "El usuario quiere entender en qué consisten los pasos del trámite.", "resol": "Explicar que el trámite tiene 3 pasos: Paso 1 INA (datos del proyecto, monto y descripción), Paso 2 ISA (geolocalización por coordenadas, KML o mapa) y Paso 3 PIA (asistente IA, 7 categorías y 44 componentes), que culminan en la categoría N1, N2 o N3.", "script": "Sí · Pasos del trámite (INA/ISA/PIA)", "brochure": "35–39 (Paso 1 INA) · 46–59 (Paso 3 PIA)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Roles y usuarios", "t3": "Tipos de rol y qué puede hacer cada uno", "caso": "El usuario pregunta qué roles existen y qué puede hacer cada uno.", "resol": "Explicar los perfiles: Titular del proyecto (responsable legal; registra, delega la gestión, da seguimiento y avala/firma la documentación) y Consultor/Tramitador (profesional habilitado que actúa en representación del titular: categoriza, completa y presenta el formulario, carga la documentación técnica y atiende observaciones). Dentro de la entidad los roles son Administrador y Tramitador.", "script": "Falta script", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Roles y usuarios", "t3": "Quién puede registrar una entidad", "caso": "El usuario pregunta quién está facultado para registrar la entidad.", "resol": "Explicar que la entidad la registra el titular o representante legal; el rol de administrador principal queda enlazado al representante legal validado ante el CNR. El consultor/tramitador no registra la entidad: es invitado por el administrador para colaborar.", "script": "Falta script", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Roles y usuarios", "t3": "Cómo aceptar una invitación", "caso": "El consultor o tramitador invitado pregunta cómo aceptar su vinculación a la entidad.", "resol": "Indicar que el invitado recibe un correo con la entidad y el rol asignado y debe hacer clic en \"Aceptar invitación\"; su estado cambiará a \"Vinculación activa\".", "script": "Parcial · Agregar tramitador (paso aceptar)", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Requisitos previos", "t3": "Requisitos para usar el sistema", "caso": "El usuario consulta qué necesita para poder usar la plataforma.", "resol": "Indicar que se requiere un correo electrónico válido y activo, registro activo como usuario en la plataforma y, para consultores, la designación formal por parte del titular del proyecto.", "script": "Falta script", "brochure": "4 (Requisitos previos)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Requisitos previos", "t3": "Requisitos para iniciar el trámite", "caso": "El usuario quiere saber qué necesita antes de iniciar el trámite ambiental.", "resol": "Indicar que desde \"Ver requisitos\" puede consultar el listado: descripción detallada del proyecto, coordenadas o archivo KML, documentos técnicos de evaluación de impacto ambiental, DUI vigente del representante legal y NIT de la entidad.", "script": "Sí · Documentos necesarios antes de iniciar", "brochure": "12–13 (Panel y requisitos del trámite)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Categorización ambiental", "t3": "Qué significan las categorías N1, N2 y N3", "caso": "El usuario pregunta qué significa la categoría resultante del trámite.", "resol": "Explicar que la categoría indica el nivel de análisis ambiental: N1 bajo impacto, N2 leve, N3 moderado o alto; y que de ella dependen los instrumentos y la documentación requeridos (por ejemplo PGA para N2, EsIA y PMA para N3).", "script": "Falta script", "brochure": "5–7 (Definiciones) · 3 (Alcance)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Alcance del servicio", "t3": "Qué proyectos cubre el SEA", "caso": "El usuario pregunta qué proyectos o trámites aplican al SEA.", "resol": "Explicar que el SEA aplica a proyectos públicos y privados en el territorio nacional que, conforme a la Ley de Medio Ambiente y su Reglamento, requieran gestión ambiental ante el MARN (actividades clasificadas según CIIU). Quedan fuera los que competen exclusivamente a otras instituciones del Estado.", "script": "Falta script", "brochure": "5–7 (Definiciones) · 3 (Alcance)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Trámite ambiental", "t3": "Qué es el formulario ambiental (declaración jurada)", "caso": "El usuario consulta sobre el carácter del formulario ambiental.", "resol": "Explicar que el formulario ambiental tiene carácter de declaración jurada: el titular o su representante declara la veracidad de la información presentada y asume la responsabilidad legal correspondiente.", "script": "Falta script", "brochure": "5–7 (Definiciones) · 3 (Alcance)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Orientación funcional", "t3": "Tiempos o resultado de la revisión del MARN", "caso": "El usuario pregunta cuánto tarda o cuál será el resultado de la revisión de su trámite.", "resol": "Aclarar con cortesía que el análisis técnico y los tiempos de resolución corresponden al MARN y que desde soporte no se anticipan resultados ni plazos. Orientar a dar seguimiento por \"Mis trámites\".", "script": "Falta script", "brochure": "35–39 (Paso 1 INA) · 46–59 (Paso 3 PIA)"}, {"tipo": "Gestión", "t1": "Gestiones administrativas", "t2": "Atención y soporte", "t3": "Soporte presencial", "caso": "Canalización de usuarios que requieren asistencia directa en ventanillas físicas o laboratorios informáticos institucionales por la complejidad de su caso.", "resol": "Proveer la dirección, dependencias específicas y horarios de atención presencial del MARN, indicando la documentación física complementaria que el usuario debe presentar para recibir el soporte en sitio.", "script": "Falta script", "brochure": "N/A (dato operativo del MARN)"}, {"tipo": "Gestión", "t1": "Gestiones administrativas", "t2": "Datos de contacto", "t3": "Correo registrado", "caso": "Corrección de errores de digitación o actualización de correos electrónicos institucionales o de usuarios en el backend de la plataforma.", "resol": "Validar que el correo registrado esté correcto; de lo contrario escalar a soporte para validar la existencia del correo en la base de datos. Solicitar correo y número de contacto para seguimiento posterior del área CC.", "script": "Falta script", "brochure": "N/A (dato operativo del MARN)"}, {"tipo": "Gestión", "t1": "Gestiones administrativas", "t2": "Datos del titular", "t3": "Actualización de datos", "caso": "Modificación de la información sustancial del perfil del titular del proyecto dentro del ecosistema digital.", "resol": "Instruir al usuario a acceder al módulo de entidades o configuración de perfil en su panel principal, seleccionar la opción de edición correspondiente, actualizar los campos requeridos y confirmar los cambios.", "script": "Sí · Actualizar información de entidad", "brochure": "22–26 (Módulo y edición de entidad)"}, {"tipo": "Gestión", "t1": "Gestiones administrativas", "t2": "Datos del titular", "t3": "Corrección de contacto", "caso": "Subsanación de errores menores en números de teléfono, direcciones físicas o medios de notificación alternos.", "resol": "Indicar cómo ingresar al apartado de edición de su entidad o perfil, modificar la sección de contactos y presionar guardar para que los cambios se reflejen en las solicitudes vinculadas.", "script": "Sí · Actualizar información de entidad", "brochure": "22–26 (Módulo y edición de entidad)"}, {"tipo": "Gestión", "t1": "Gestiones de trámites", "t2": "Documentación", "t3": "Carga de documentación", "caso": "Asistencia en la anexión digital de expedientes y archivos probatorios solicitados por la plataforma.", "resol": "Indicar que ingrese al módulo \"Carga de documentación\", seleccione el casillero del requisito, cargue el archivo en formato admitido (generalmente PDF) y valide que se guarde antes de continuar. Si no es posible, solicitar la documentación y el ID de trámite para consultarlo.", "script": "Parcial · Registrar entidad / Finalizar trámite", "brochure": "18–21 (Carga de documentación)"}, {"tipo": "Gestión", "t1": "Gestiones de trámites", "t2": "Documentación", "t3": "Corrección documental", "caso": "Atención a incidencias donde el usuario carga de forma incorrecta la documentación.", "resol": "Indicar que ingrese al detalle de su trámite en la pestaña \"Documentos\", corrija el archivo localmente y lo reemplace en la plataforma usando la opción de recarga habilitada.", "script": "Parcial · Registrar entidad / Finalizar trámite", "brochure": "18–21 (Carga de documentación)"}, {"tipo": "Gestión", "t1": "Gestiones de trámites", "t2": "Georreferenciación", "t3": "Duplicidad de proyectos", "caso": "El usuario reporta, o el sistema detecta, que un proyecto o su área geográfica se superpone o duplica con otro trámite.", "resol": "Validar el ID del trámite y las coordenadas/KML cargados. Si es el mismo proyecto ya iniciado, orientar a retomar el borrador existente (máx. 5 borradores por entidad). Si son proyectos distintos con superposición legítima, levantar ticket a TI con los IDs de ambos trámites para revisión. (Resolución por validar con desarrollo/MARN.)", "script": "Falta script", "brochure": "General"}, {"tipo": "Gestión", "t1": "Gestiones de trámites", "t2": "Trámite ambiental", "t3": "Retomar un borrador", "caso": "El usuario dejó el trámite a medias y quiere continuarlo.", "resol": "Indicar que el trámite queda guardado como \"borrador\" (máximo 5 por entidad) y puede retomarlo desde \"Mis trámites\" en cualquier momento.", "script": "Falta script", "brochure": "General"}, {"tipo": "Gestión", "t1": "Gestiones de usuarios", "t2": "Acceso y autenticación", "t3": "Restablecimiento de contraseña", "caso": "El usuario no recuerda su contraseña para ingresar al portal y solicita asistencia para recuperarla.", "resol": "Guiar para que en la pantalla de inicio haga clic en \"Recuperar contraseña\", ingrese su correo registrado, presione \"Enviar enlace de recuperación\", abra el enlace recibido y configure una nueva contraseña que cumpla los criterios de seguridad obligatorios.", "script": "Sí · Olvidé mi contraseña", "brochure": "8–11 (Acceso al sistema)"}, {"tipo": "Gestión", "t1": "Gestiones de usuarios", "t2": "Administración de usuarios", "t3": "Vinculación de usuarios y accesos", "caso": "El titular o administrador requiere asociar o dar accesos a un nuevo consultor ambiental para que colabore en la gestión de sus trámites.", "resol": "Instruir al administrador de la entidad a iniciar sesión, ingresar al módulo \"Gestión de roles y usuarios vinculados\" e invitar al consultor digitando de forma exacta su correo y seleccionando el rol correspondiente.", "script": "Sí · Agregar tramitador a la entidad", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Gestión", "t1": "Gestiones de usuarios", "t2": "Roles y permisos", "t3": "Asignación de tramitador", "caso": "Dificultad o error visual en la interfaz al delegar el rol de tramitador/consultor a un miembro del equipo de la entidad.", "resol": "Validar que el tramitador ya posea cuenta creada y confirmada. Indicar que reintente el envío de la invitación desde el panel de usuarios vinculados. Si el error persiste, levantar ticket a TI especificando el NIT de la empresa y el correo del tramitador.", "script": "Sí · Agregar tramitador a la entidad", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Gestión", "t1": "Gestiones de usuarios", "t2": "Roles y permisos", "t3": "Asignación de administrador", "caso": "Imposibilidad de actualizar o transferir el rol de administrador principal dentro de la personería jurídica registrada.", "resol": "Explicar que el rol de administrador principal está enlazado al representante legal validado ante el CNR. Si hubo cambio de junta directiva o representante legal, debe actualizarse primero en el CNR; de lo contrario, levantar ticket a TI adjuntando la escritura para su corrección manual.", "script": "Falta script", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Gestión", "t1": "Gestiones de usuarios", "t2": "Roles y permisos", "t3": "Cambio o eliminación de roles", "caso": "El administrador necesita desvincular o rebajar los permisos de un consultor de manera permanente.", "resol": "Indicar que ingrese a \"Gestión de roles y usuarios vinculados\", localice al usuario, presione el botón de tres puntos y seleccione editar o remover permisos, confirmando la acción para que se aplique en tiempo real.", "script": "Sí · Cambiar rol / cancelar vinculación", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Gestión", "t1": "Gestiones de usuarios", "t2": "Entidad", "t3": "Confirmar o activar el correo institucional", "caso": "El usuario no activó la entidad o necesita reenviar el correo de confirmación.", "resol": "Indicar que abra el correo de confirmación y haga clic en \"Confirmar email institucional\". Recordar que el enlace expira en 48 h; si expiró y la entidad quedó bloqueada, gestionar el reenvío o la activación (escalar a TI si no es posible reenviar).", "script": "Parcial · Registrar una entidad", "brochure": "22–26 (Módulo y edición de entidad)"}, {"tipo": "Gestión", "t1": "Gestiones de usuarios", "t2": "Entidad", "t3": "Agregar copropietario", "caso": "El usuario necesita agregar un copropietario o titular adicional a la entidad.", "resol": "Indicar que en el registro o edición de la entidad use \"Agregar copropietario\" y complete nombre, DUI, NIT, correo y teléfono, luego guardar y verificar que aparezca en el listado.", "script": "Parcial · Registrar una entidad", "brochure": "14–17 (Registro de entidad)"}, {"tipo": "Gestión", "t1": "Gestiones de usuarios", "t2": "Entidad", "t3": "Editar o actualizar la entidad", "caso": "El usuario quiere modificar datos de una entidad ya registrada.", "resol": "Indicar que en \"Mis entidades\" > \"Ver entidad\" > \"Editar\" (ícono de lápiz) actualice los campos necesarios y guarde; recibirá confirmación en pantalla y por correo.", "script": "Sí · Actualizar información de entidad", "brochure": "22–26 (Módulo y edición de entidad)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Acceso al portal", "t3": "Cuenta creada sin acceso", "caso": "El usuario finalizó el registro pero el portal le deniega el ingreso o indica que su cuenta no está autorizada.", "resol": "Verificar si completó la verificación obligatoria haciendo clic en el enlace de activación enviado a su correo. Pedir que revise Spam. Si el registro existe pero sigue inactivo, levantar ticket a TI con el DUI para la activación manual.", "script": "Falta script", "brochure": "8–11 (Acceso al sistema)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Acceso al portal", "t3": "No puede iniciar sesión", "caso": "Error técnico general (pantalla congelada, bucle infinito o rechazo de credenciales) al ingresar a la plataforma.", "resol": "Recomendar borrar cookies y caché del explorador o usar ventana de incógnito (preferible Google Chrome). Si no es problema local, recabar capturas del error e ID de usuario y remitir a soporte TI N2.", "script": "Parcial · Ingreso (inicio de sesión)", "brochure": "8–11 (Acceso al sistema)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Acceso al portal", "t3": "Usuario bloqueado", "caso": "El sistema restringe el acceso temporalmente por digitar erróneamente la contraseña en múltiples intentos consecutivos.", "resol": "Informar que la cuenta fue bloqueada por políticas de seguridad e instruir a esperar el lapso reglamentario de desbloqueo automático.", "script": "Falta script", "brochure": "8–11 (Acceso al sistema)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Acceso al portal", "t3": "OTP login no recibido", "caso": "El usuario introduce su contraseña pero el código de segundo factor (2FA) indispensable para ingresar nunca llega a su correo.", "resol": "Recomendar revisar Spam, Promociones o Notificaciones. Si el contador llega a cero, usar \"Reenviar código\". Si continúa y el correo es correcto, levantar ticket prioritario a TI por posible retraso o encolamiento en el servidor de correos.", "script": "Parcial · Ingreso (inicio de sesión)", "brochure": "8–11 (Acceso al sistema)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Acceso al portal", "t3": "OTP login inválido", "caso": "El sistema rechaza el código de autenticación indicando que ya no es válido o caducó.", "resol": "Explicar que por seguridad las claves OTP tienen validez de pocos minutos. Solicitar generar un nuevo token con \"Reenviar código\", abrir el correo más reciente e introducirlo de inmediato.", "script": "Parcial · Ingreso (inicio de sesión)", "brochure": "8–11 (Acceso al sistema)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Asistente IA", "t3": "Interpretación incorrecta", "caso": "El asistente de IA brinda respuestas erráticas o no comprende las instrucciones del ciudadano.", "resol": "Aconsejar reformular la pregunta con lenguaje directo y palabras clave de los manuales, o referirse de forma exacta a los índices (INA, ISA, PIA). Registrar el caso como retroalimentación para la calibración del modelo, brindando el ID del trámite.", "script": "Falta script", "brochure": "46–59 (Paso 3 PIA · asistente IA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Asistente IA", "t3": "IA no carga", "caso": "El componente visual del chatbot inteligente no aparece en la plataforma.", "resol": "Validar que el navegador no tenga extensiones de bloqueo (AdBlockers) o scripts que impidan ejecutar complementos. Probar con otro navegador compatible y, de persistir, reportar a TI con captura e ID del trámite.", "script": "Falta script", "brochure": "46–59 (Paso 3 PIA · asistente IA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Asistente IA", "t3": "Demora de inicio", "caso": "El chatbot se queda en un bucle prolongado cargando antes de permitir la primera interacción.", "resol": "Indicar que actualice el portal con Ctrl + F5 o limpiando la caché. Explicar que bajo alta concurrencia el microservicio puede requerir unos segundos adicionales para establecer el canal seguro.", "script": "Falta script", "brochure": "46–59 (Paso 3 PIA · asistente IA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Asistente IA", "t3": "Conectividad IA", "caso": "Aparece un mensaje en el chat sobre desconexión de red o falla en la API del asistente.", "resol": "Comunicar que hay una intermitencia temporal en los servidores de IA. Recomendar la navegación manual por los menús tradicionales o apoyarse en los manuales de usuario en PDF mientras se normaliza el servicio.", "script": "Falta script", "brochure": "46–59 (Paso 3 PIA · asistente IA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Asistente IA", "t3": "Explicación incorrecta", "caso": "El chatbot provee definiciones o explicaciones que no quedan claras.", "resol": "Aclarar verbalmente el concepto correcto con base en \"Definiciones\" del Manual de Usuario Externo. Solicitar captura del diálogo y canalizar al equipo de desarrollo para corregir las bases de conocimiento de la IA.", "script": "Falta script", "brochure": "46–59 (Paso 3 PIA · asistente IA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Asistente IA", "t3": "Respuestas inconsistentes", "caso": "El asistente ofrece respuestas contradictorias ante una misma consulta en momentos diferentes.", "resol": "Explicar que las consultas al asistente son orientativas y que el único criterio normativo válido es el del manual y la ley ambiental. Documentar y remitir el comportamiento a TI para revisión técnica.", "script": "Falta script", "brochure": "46–59 (Paso 3 PIA · asistente IA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Asistente IA", "t3": "Chat bloqueado", "caso": "La IA entra en bucle y repite las mismas preguntas sin dejar avanzar.", "resol": "Revisar la pregunta de la IA y la respuesta del usuario; validar si responde con sinónimos o si no aporta a lo consultado, y ayudarle a dar una mejor respuesta. Si no se resuelve, documentar, brindar el ID de la interacción y subirlo a TI.", "script": "Falta script", "brochure": "46–59 (Paso 3 PIA · asistente IA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Asistente IA", "t3": "Categorización inconclusa", "caso": "La IA se interrumpe o deja de guiar al usuario en medio del llenado asistido de los criterios.", "resol": "Validar si hay algún ítem pendiente de completar; solicitar a la IA finalizar la categorización. Si no lo realiza, brindar a soporte el ID de interacción y subirlo a TI.", "script": "Falta script", "brochure": "35–39 (Paso 1 INA) · 46–59 (Paso 3 PIA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Asistente IA", "t3": "Respuesta lenta", "caso": "El tiempo de respuesta del asistente es muy elevado (superior a 30 segundos), generando demora molesta.", "resol": "Ofrecer disculpas y aclarar que se debe a un pico de demanda en el procesamiento de lenguaje natural. Aconsejar consultas más cortas o concretas mientras los servidores se estabilizan.", "script": "Falta script", "brochure": "46–59 (Paso 3 PIA · asistente IA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Asistente IA", "t3": "Guardado de respuestas", "caso": "El portal reporta un fallo al descargar o guardar la bitácora o historial de la conversación con la IA.", "resol": "Explicar que el chat está diseñado para orientación rápida en vivo. Como alternativa, sugerir copiar el texto relevante en un documento local o tomar capturas, y levantar caso a soporte para auditar el funcionamiento.", "script": "Falta script", "brochure": "46–59 (Paso 3 PIA · asistente IA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Autenticación", "t3": "Demora OTP", "caso": "Demora excesiva en el despacho de códigos OTP de registro, login o firma, afectando el flujo del trámite.", "resol": "Indicar que evite clics repetidos en solicitar el código, ya que cada intento anula el anterior y satura la pasarela. Sugerir esperar 2 minutos. Si la demora es masiva, escalar a TI para revisar la conectividad del proveedor de mensajería/SMTP institucional.", "script": "Falta script", "brochure": "8–11 (Acceso al sistema)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Autenticación", "t3": "Servicio de autenticación", "caso": "Caída integral del servicio central de autenticación y firmado seguro del portal, imposibilitando el acceso de usuarios.", "resol": "Notificar que el módulo de seguridad central está en mantenimiento correctivo de emergencia. Invitar a intentar nuevamente en una hora. Clasificar con prioridad Crítica y reportar de inmediato a administradores de redes e infraestructura de TI.", "script": "Falta script", "brochure": "8–11 (Acceso al sistema)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Categorización ambiental", "t3": "Resultado IA incorrecto", "caso": "El motor de IA calcula y propone una categoría ambiental evidentemente desalineada o errónea para la obra descrita.", "resol": "Comunicar que la recomendación de la IA es una herramienta de apoyo preliminar. Si el consultor detecta inconsistencias de fondo, puede tramitar una \"Solicitud de cambio de categoría\", que será evaluada manualmente por los coordinadores del MARN.", "script": "Falta script", "brochure": "35–39 (Paso 1 INA) · 46–59 (Paso 3 PIA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Categorización ambiental", "t3": "Pantalla no visible", "caso": "Tras completar el PIA, la interfaz no proyecta la pantalla de resultados donde se calcula la categoría sugerida.", "resol": "Corroborar que estén completos todos los campos obligatorios de los tres formularios (INA, ISA y PIA) y solicitar a la IA la categorización. Derivar a TI con el ID del trámite en borrador.", "script": "Falta script", "brochure": "35–39 (Paso 1 INA) · 46–59 (Paso 3 PIA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Categorización ambiental", "t3": "Generación de categorización", "caso": "El sistema arroja un error general del servidor al procesar las matrices de puntaje ambiental, deteniendo el trámite.", "resol": "Identificar y documentar el ID del borrador. Escalar con carácter urgente a desarrollo de TI para auditar si el error se debe a caracteres especiales incompatibles en las descripciones o un fallo lógico en la base de datos.", "script": "Falta script", "brochure": "35–39 (Paso 1 INA) · 46–59 (Paso 3 PIA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Categorización ambiental", "t3": "Resultado incorrecto", "caso": "El sistema efectúa la operación pero arroja un nivel de categoría que no coincide con las tablas oficiales del MARN.", "resol": "Solicitar al consultor revisar los datos vaciados en los criterios de ISA y PIA, ya que una ponderación incorrecta altera el resultado. Si los parámetros son verídicos y el sistema calcula mal, reportar a TI.", "script": "Falta script", "brochure": "35–39 (Paso 1 INA) · 46–59 (Paso 3 PIA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Categorización ambiental", "t3": "Nota no generada", "caso": "La solicitud concluye con éxito pero el PDF oficial \"Nota de Categorización\" no aparece adjunto en el expediente.", "resol": "Validar el estado del trámite en el listado. Si el estado es correcto pero ": "El sistema falla al generar los documentos del trámite.", "resol": "Documentar el ID del trámite y captura del error; escalar a TI para revisar la tarea de generación/renderizado de documentos.", "script": "Falta script", "brochure": "18–21 (Carga de documentación)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Documentación", "t3": "Documento corrupto", "caso": "El documento generado (p. ej. Nota de Categorización) se descarga dañado o no abre.", "resol": "Validar que no sea problema del visor local; solicitar reintentar la descarga. Si persiste, levantar ticket a TI con el ID de trámite para regenerar el archivo.", "script": "Falta script", "brochure": "18–21 (Carga de documentación)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Documentación", "t3": "Documentos no visibles", "caso": "La lista de documentos requeridos no aparece tras la categorización del trámite.", "resol": "Confirmar que el trámite tenga la categoría generada; recargar con Ctrl + F5. Si los requisitos no aparecen, escalar a TI con el ID de trámite.", "script": "Falta script", "brochure": "18–21 (Carga de documentación)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Documentación", "t3": "Error de carga", "caso": "Falla al subir un documento requerido a la plataforma.", "resol": "Validar formato admitido (.jpg, .pdf, .docx) y tamaño máximo de 10 MB; reintentar la carga. Si persiste, solicitar el documento y el ID de trámite y escalar a TI.", "script": "Falta script", "brochure": "General"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Documentación", "t3": "Formato inválido", "caso": "El sistema rechaza el archivo por tener un formato no admitido.", "resol": "Indicar los formatos admitidos (.jpg, .pdf, .docx) y el máximo de 10 MB; orientar a convertir o comprimir el archivo y recargarlo.", "script": "Falta script", "brochure": "General"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Documentación", "t3": "Documento no guardado", "caso": "Tras cargar el archivo, este no queda guardado en la plataforma.", "resol": "Validar la conexión y reintentar; verificar que se presionó guardar. Si persiste, solicitar el ID de trámite y captura y escalar a TI.", "script": "Falta script", "brochure": "18–21 (Carga de documentación)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Documentación", "t3": "Documento no disponible en revisión", "caso": "Documentos cargados por el usuario no aparecen del lado de revisión del MARN.", "resol": "Confirmar la carga exitosa en \"Carga de documentos\". Documentar el ID de trámite y escalar a TI para validar la sincronización con el módulo de revisión.", "script": "Falta script", "brochure": "18–21 (Carga de documentación)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Funcionalidad general", "t3": "Falla del sistema", "caso": "Fallo general de funcionalidad del portal (botones sin responder, pantallas con error, comportamientos no específicos).", "resol": "Orientar a limpiar caché o probar navegador compatible (Chrome) o ventana de incógnito. Si persiste, recabar captura, URL/sección e ID de usuario/trámite y escalar a soporte TI N2.", "script": "Falta script", "brochure": "N/A (incidencia técnica general)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Gestión de entidades", "t3": "Error de vinculación", "caso": "Un usuario invitado no logra vincularse a la entidad.", "resol": "Validar que el invitado tenga cuenta creada y confirmada y que el correo esté bien escrito; reenviar la invitación desde \"Gestión de roles\". Si persiste, levantar ticket a TI con el NIT y el correo.", "script": "Falta script", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Gestión de entidades", "t3": "Usuario duplicado en entidad", "caso": "El sistema indica que el usuario ya está vinculado a la entidad.", "resol": "Verificar en \"Gestión de roles\" si ya aparece vinculado o con invitación pendiente; orientar a usar el acceso existente. Si hay inconsistencia, escalar a TI con el NIT.", "script": "Falta script", "brochure": "General"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Gestión de entidades", "t3": "Creación de entidad", "caso": "Falla al registrar la entidad en la plataforma.", "resol": "Validar que el NIT y NRC tengan el formato correcto y los datos completos. Si la falla es en la validación con CNR, ver \"Integración CNR\". Si es error de sistema, recabar captura y datos y escalar a TI.", "script": "Falta script", "brochure": "14–17 (Registro de entidad)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Gestión de entidades", "t3": "Entidad duplicada", "caso": "El sistema indica que la empresa ya se encuentra registrada.", "resol": "Informar que la entidad ya existe; orientar a solicitar la vinculación o el rol al administrador existente. Si el usuario no reconoce quién la registró, escalar a TI con el NIT.", "script": "Falta script", "brochure": "14–17 (Registro de entidad)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Integración CNR", "t3": "Validación representante legal", "caso": "Falla la validación del representante legal contra la base del Centro Nacional de Registros (CNR).", "resol": "Verificar que el DUI/NIT estén correctos; explicar que el cruce con el CNR es en tiempo real. Si los datos son correctos, escalar a TI para validar la conectividad con el CNR.", "script": "Falta script", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Integración CNR", "t3": "Representante legal inválido", "caso": "El DUI ingresado no coincide con el representante legal vigente en el CNR.", "resol": "Explicar que el usuario firmante debe coincidir con el representante legal registrado ante el CNR. Si hubo cambio de representación, debe actualizarse primero en el CNR; alternativamente, usar el mecanismo de asignación de roles e invitaciones.", "script": "Falta script", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Integración CNR", "t3": "NIT inválido", "caso": "El sistema no acepta el NIT de la empresa.", "resol": "Verificar que el NIT o Registro de Comercio no contenga guiones adicionales ni errores de digitación. Si el dato es correcto y la empresa está inscrita, levantar ticket a TI para validar la conectividad de la consulta con el CNR.", "script": "Falta script", "brochure": "14–17 (Registro de entidad)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Integración CNR", "t3": "Empresa no encontrada", "caso": "El registro automatizado de una personería jurídica falla porque la consulta no localiza el registro en la base del CNR.", "resol": "Solicitar verificar que el NIT o Registro de Comercio no contenga guiones adicionales ni errores. Si el dato es correcto y la empresa está inscrita, levantar ticket a TI para validar la conectividad de la consulta.", "script": "Falta script", "brochure": "14–17 (Registro de entidad · validación CNR)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Integración CNR", "t3": "Interoperabilidad CNR", "caso": "Caída o indisponibilidad técnica del servicio web (API) provisto por el Centro Nacional de Registros.", "resol": "Notificar que hay una intermitencia técnica ajena al portal del MARN en el servicio de validación del CNR. Recomendar borrar la caché, esperar unos minutos e intentar nuevamente.", "script": "Falta script", "brochure": "14–17 (Registro de entidad · validación CNR)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Integración CNR", "t3": "Representante no autorizado", "caso": "El sistema externo bloquea cuando el DUI o NIT del usuario que registra la organización no e": "8–11 (Acceso al sistema)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Registro de usuarios", "t3": "Registro portal externo", "caso": "Error crítico del sistema o de base de datos que impide completar la creación del perfil de tramitador o titular.", "resol": "Solicitar capturas del error, aconsejar usar navegadores compatibles (Chrome actualizado) y escalar a soporte TI N2 si la plataforma deniega el acceso sin justificación, con datos completos del usuario y captura.", "script": "Parcial · Registro de nueva cuenta", "brochure": "8–11 (Acceso al sistema)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Roles y permisos", "t3": "Invitación no recibida", "caso": "Omisión o pérdida del correo de enlace enviado a un consultor o tramitador para vincularse a una organización.", "resol": "Solicitar al administrador que ingrese a \"Gestión de roles y usuarios vinculados\", verifique la escritura exacta del correo del invitado, y remueva y reenvíe la invitación. Validar que los datos del usuario estén correctamente ingresados por la entidad.", "script": "Parcial · Agregar tramitador", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Roles y permisos", "t3": "Sin acceso a trámites", "caso": "Restricción que impide a un usuario visualizar o editar las solicitudes de la empresa que representa.", "resol": "Explicar que las facultades dependen del nivel asignado (Titular, Consultor, etc.). El administrador debe ingresar al panel de usuarios vinculados y comprobar que el rol cuente con los permisos requeridos para la gestión de trámites.", "script": "Parcial · Cambiar rol / vinculación", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Roles y permisos", "t3": "Permisos incorrectos", "caso": "Un usuario cuenta con accesos indebidos o bloqueos de opciones que no corresponden a su perfil configurado.", "resol": "Validar el tipo de perfil asignado en la plataforma. Si los roles son correctos en pantalla pero las funciones siguen presentando fallos de restricción, escalar a los administradores del sistema (TI) para depurar privilegios.", "script": "Parcial · Cambiar rol / vinculación", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Gestión de entidades", "t3": "Entidad bloqueada por falta de confirmación (48 h)", "caso": "La entidad quedó bloqueada porque no se confirmó el correo institucional dentro de las 48 h.", "resol": "Confirmar si el enlace de activación expiró (48 h). Si la entidad está bloqueada, levantar ticket a TI con el NIT para el reenvío del enlace o la activación manual.", "script": "Falta script", "brochure": "General"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Gestión de entidades", "t3": "Correo de confirmación de entidad no recibido", "caso": "No llega el correo de confirmación del email institucional de la entidad.", "resol": "Pedir revisar Spam y Promociones y validar que el correo esté correcto; si no llega, escalar a TI con el NIT y el correo para el reenvío.", "script": "Falta script", "brochure": "General"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Geolocalización (ISA)", "t3": "Error al validar la geolocalización", "caso": "El sistema no valida la geolocalización del Paso 2 (ISA).", "resol": "Verificar que se marcó la casilla de confirmación y se presionó \"Validar\". Si no procesa, capturar el error y el ID de trámite y escalar a TI.", "script": "Falta script", "brochure": "40–45 (Paso 2 ISA)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Geolocalización (ISA)", "t3": "KML no carga o formato inválido", "caso": "El archivo KML no se carga o es rechazado por el sistema.", "resol": "Validar que el KML no exceda 10 MB y sea válido (puede comprobarse en Google Earth tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Envío del trámite", "t3": "Casillas de términos o juramento no se marcan", "caso": "No se pueden marcar las casillas de términos y condiciones o de declaración jurada.", "resol": "Sugerir recargar con Ctrl + F5 o probar otro navegador (Chrome). Si persiste, capturar el error y el ID de trámite y escalar a TI.", "script": "Falta script", "brochure": "46–59 (Finalizar y seguimiento del trámite)"}, {"tipo": "Incidencia", "t1": "Incidentes Portal de Trámites", "t2": "Seguimiento del trámite", "t3": "No visualiza el estado o el historial del trámite", "caso": "El usuario no ve el estado, los detalles o el historial en \"Mis trámites\".", "resol": "Pedir recargar y validar que el trámite fue enviado. Si no aparece la información, capturar el error y el ID de trámite y escalar a TI.", "script": "Falta script", "brochure": "46–59 (Finalizar y seguimiento del trámite)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Roles", "t3": "Permisos requeridos", "caso": "El usuario pregunta qué permisos tiene cada rol o qué puede hacer según su rol.", "resol": "Explicar que los permisos dependen del rol: el Administrador gestiona la entidad, los usuarios vinculados y los roles; el Tramitador gestiona los trámites según lo que el administrador le habilite.", "script": "Falta script", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Entidad", "t3": "Administración de entidades", "caso": "El usuario quiere saber cómo administrar las entidades que tiene registradas.", "resol": "Indicar que desde \"Mis entidades\" puede ver el detalle, editar los datos y gestionar los roles de cada entidad registrada.", "script": "Sí · Actualizar información de entidad", "brochure": "14–17 (Registro de entidad)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Entidad", "t3": "Representantes legales autorizados para crear entidad", "caso": "El usuario pregunta quién puede figurar como representante legal para crear la entidad.", "resol": "Explicar que debe ser el representante legal vigente validado ante el CNR; el sistema cruza el DUI/NIT en tiempo real. Si hubo cambio de representación, debe actualizarse primero en el CNR.", "script": "Falta script", "brochure": "27–34 (Gestión de roles) · 4–5 (Roles)"}, {"tipo": "Consulta", "t1": "Consultas", "t2": "Documentación", "t3": "Formato de archivos permitido", "caso": "El usuario consulta qué formatos y tamaño de archivo admite la plataforma.", "resol": "Indicar los formatos admitidos (.jpg, .pdf y .docx) con un máximo de 10 MB por archivo.", "script": "Falta script", "brochure": "18–21 (Carga de documentación)"}];
const GUIONES = {"Consultas||Orientación funcional||Conceptos técnicos ambientales": "Con gusto le aclaro, apoyándome en el apartado de Definiciones del manual. El <b>INA</b> (Índice de Naturaleza y Envergadura de la Actividad) estima la magnitud y el riesgo según las actividades del proyecto. El <b>ISA</b> (Índice de Significancia Ambiental) mide los cambios en los ecosistemas del sitio mediante la geolocalización. El <b>PIA</b> (Índice Potencial de Impacto Ambiental) evalúa los posibles impactos con apoyo del asistente de IA. Los tres se combinan para sugerir la categoría del proyecto.<br><br>¿Hay algo más en lo que pueda asistir?", "Consultas||Orientación funcional||Dificultad en flujo": "No se preocupe, con gusto le explico. Todo trámite queda guardado automáticamente en modo \"borrador\", así que puede retomarlo en cualquier momento desde \"Mis trámites\".<br><br><b>Nota para el agente:</b> indicar que hay un límite de 5 borradores por entidad.<br><br>¿Hay algo más en lo que pueda asistir?", "Consultas||No relacionadas al servicio||": "Comprendo su consulta. Este requerimiento corresponde a [otra institución / otra dependencia], por lo que desde el Centro de Soporte del SEA no podríamos gestionarlo. Con gusto le comparto el canal de atención correspondiente: <b>[POR VALIDAR — catálogo de instituciones y contactos de derivación]</b>.<br><br><b>Nota para el agente:</b> registrar la llamada como consulta y cerrarla.<br><br>¿Hay algo más en lo que pueda asistir?", "Consultas||Roles y usuarios||Tipos de rol y qué puede hacer cada uno": "Con mucho gusto le explico. En la plataforma existen dos perfiles. El <b>Titular del proyecto</b> es la persona natural o jurídica responsable legal: registra su cuenta, puede delegar la gestión a un consultor, da seguimiento a sus trámites y avala o firma la documentación. El <b>Consultor o Tramitador</b> es el profesional habilitado que actúa en representación del titular: realiza la categorización, completa y presenta el formulario, carga la documentación técnica y atiende las observaciones. Dentro de cada entidad, los roles que se asignan son <b>Administrador</b> y <b>Tramitador</b>.<br><br>¿Le quedó clara la diferencia? ¿Hay algo más en lo que pueda asistir?", "Consultas||Roles y usuarios||Quién puede registrar una entidad": "Con gusto le oriento. La entidad la registra el <b>titular o el representante legal</b>. El rol de administrador principal queda enlazado al representante legal vigente, que el sistema valida en tiempo real contra el CNR. El consultor o tramitador no registra la entidad: es el administrador quien lo invita a colaborar.<br><br><b>Nota para el agente:</b> si hubo cambio de representante legal, primero debe actualizarse en el CNR antes de registrar o transferir la administración.<br><br>¿Hay algo más en lo que pueda asistir?", "Consultas||Requisitos previos||Requisitos para usar el sistema": "Con gusto le indico. Para utilizar el sistema necesita tres cosas: un <b>correo electrónico válido y activo</b>, su <b>registro activo</b> como usuario en la plataforma y, si usted es consultor, la <b>designación formal</b> por parte del titular del proyecto.<br><br>¿Hay algo más en lo que pueda asistir?", "Consultas||Categorización ambiental||Qué significan las categorías N1, N2 y N3": "Con gusto le explico. La categoría indica el nivel de análisis ambiental del proyecto: <b>N1</b> bajo impacto, <b>N2</b> leve y <b>N3</b> moderado o alto. De la categoría dependen los instrumentos y la documentación que el sistema le solicitará; por ejemplo, un Plan de Gestión Ambiental para N2, o un Estudio de Impacto Ambiental con su Programa de Manejo para N3.<br><br><b>Nota para el agente:</b> no anticipe qué categoría le saldrá al usuario; eso lo determina el sistema y el análisis del MARN.<br><br>¿Hay algo más en lo que pueda asistir?", "Consultas||Alcance del servicio||Qué proyectos cubre el SEA": "Con gusto le oriento. El SEA aplica a proyectos públicos y privados en el territorio nacional que, conforme a la Ley de Medio Ambiente y su Reglamento, requieran gestión ambiental ante el MARN, según las actividades clasificadas en el CIIU. Quedan fuera los proyectos cuya gestión corresponde exclusivamente a otras instituciones del Estado.<br><br>¿Hay algo más en lo que pueda asistir?", "Consultas||Trámite ambiental||Qué es el formulario ambiental (declaración jurada)": "Con gusto le explico. El formulario ambiental tiene carácter de <b>declaración jurada</b>: al presentarlo, el titular o su representante declara que la información es verídica y asume la responsabilidad legal correspondiente sobre su contenido.<br><br>¿Hay algo más en lo que pueda asistir?", "Consultas||Orientación funcional||Tiempos o resultado de la revisión del MARN": "Comprendo su consulta. El análisis técnico y los tiempos de resolución corresponden al MARN, y desde el Centro de Soporte no podemos anticipar resultados ni plazos. Lo que sí puedo hacer es orientarle para que dé seguimiento a su trámite desde la sección \"Mis trámites\", donde verá el estado actualizado.<br><br>¿Hay algo más en lo que pueda asistir?", "Gestiones administrativas||Atención y soporte||Soporte presencial": "Con gusto le oriento. Si su caso requiere atención directa, puede acercarse a <b>[POR VALIDAR: dirección y dependencia del MARN]</b>, en horario de <b>[POR VALIDAR: horario]</b>. Le recomiendo llevar <b>[POR VALIDAR: documentación física complementaria]</b>.<br><br>¿Hay algo más en lo que pueda asistir?", "Gestiones administrativas||Datos de contacto||Correo registrado": "Con gusto le asisto. Validemos primero que el correo registrado esté correcto.<br><br><b>Nota para el agente:</b> si hay un error en el dato, escale a soporte para verificar la existencia del correo en la base de datos. Solicite un correo y un número de contacto para el seguimiento posterior del área de Call Center.<br><br>¿Hay algo más en lo que pueda asistir?", "Gestiones de trámites||Georreferenciación||Duplicidad de proyectos": "Con gusto lo revisamos. Validemos el ID del trámite y las coordenadas o el KML cargados. Si se trata del mismo proyecto ya iniciado, puede retomar el borrador existente. Si son proyectos distintos con una superposición legítima, registro su gestión con los ID de ambos trámites para que el equipo técnico lo revise.<br><br><b>Nota para el agente:</b> resolución por validar con desarrollo/MARN.<br><br>¿Hay algo más en lo que pueda asistir?", "Gestiones de trámites||Trámite ambiental||Retomar un borrador": "Con gusto le indico. Su trámite quedó guardado como \"borrador\" y puede retomarlo en cualquier momento desde \"Mis trámites\".<br><br><b>Nota para el agente:</b> recordar el máximo de 5 borradores por entidad.<br><br>¿Hay algo más en lo que pueda asistir?", "Gestiones de usuarios||Roles y permisos||Asignación de administrador": "Comprendo. El rol de administrador principal está enlazado al representante legal validado ante el CNR. Si hubo un cambio de junta directiva o de representante legal, primero debe actualizarse en el CNR.<br><br><b>Nota para el agente:</b> si ya está actualizado y aun así no puede asignarlo, registre la gestión y escale al equipo técnico adjuntando la escritura correspondiente para su corrección manual.<br><br>¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Acceso al portal||Cuenta creada sin acceso": "Lamento el inconveniente, con gusto lo revisamos. Vamos a verificar:<br>1. Confirme que haya completado la verificación haciendo clic en el enlace de activación enviado a su correo.<br>2. Por favor revise también la carpeta de Spam o correo no deseado.<br><br><b>Nota para el agente:</b> si el registro existe pero la cuenta sigue inactiva, registre la gestión y escale al equipo técnico con el DUI para la activación manual.<br><br>¿Pudo ingresar? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Acceso al portal||No puede iniciar sesión": "Lamento el inconveniente, con gusto lo revisamos. Vamos a intentar lo siguiente:<br>1. Borre las cookies y la caché del navegador, o utilice una ventana de incógnito (preferiblemente en Google Chrome).<br>2. Intente ingresar nuevamente.<br><br><b>Nota para el agente:</b> si no es un problema local del navegador, recabe la captura del error y el ID de usuario, registre la gestión y escale al equipo técnico de nivel 2.<br><br>¿Pudo ingresar? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Acceso al portal||Usuario bloqueado": "Comprendo. Su cuenta se bloqueó por seguridad tras varios intentos de contraseña. Le pido esperar el lapso reglamentario de desbloqueo automático <b>[POR VALIDAR: tiempo]</b> y luego intentar nuevamente.<br><br>¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Acceso al portal||OTP login no recibido": "Con gusto le asisto. Vamos a realizar lo siguiente:<br>1. Revise su bandeja de entrada y también las carpetas de Spam, Promociones o Notificaciones.<br>2. Si el contador en pantalla llegó a cero, seleccione \"Reenviar código\".<br>3. Abra el correo más reciente y digite el código de inmediato, ya que por seguridad caduca en pocos minutos.<br><br><b>Nota para el agente:</b> si el correo es correcto y el código no llega, registre la gestión y escale al equipo técnico por posible retraso en el servidor de correos.<br><br>¿Pudo ingresar el código? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Acceso al portal||OTP login inválido": "Con gusto le asisto. Vamos a realizar lo siguiente:<br>1. Revise su bandeja de entrada y también las carpetas de Spam, Promociones o Notificaciones.<br>2. Si el contador en pantalla llegó a cero, seleccione \"Reenviar código\".<br>3. Abra el correo más reciente y digite el código de inmediato, ya que por seguridad caduca en pocos minutos.<br><br><b>Nota para el agente:</b> si el correo es correcto y el código no llega, registre la gestión y escale al equipo técnico por posible retraso en el servidor de correos.<br><br>¿Pudo ingresar el código? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Asistente IA||Interpretación incorrecta": "Lamento el inconveniente, con gusto le ayudo. Permítame aclararle el concepto correcto con base en el apartado de Definiciones del manual. Si la conversación se quedó en un bucle, revisemos juntos la respuesta que ingresó para reformularla con mayor claridad.<br><br><b>Nota para el agente:</b> solicite una captura del diálogo y el ID de la interacción, registre la gestión y remítala al equipo de desarrollo para revisar las bases de conocimiento de la IA.<br><br>¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Asistente IA||IA no carga": "Lamento el inconveniente. Tomemos en cuenta que el asistente es una herramienta de apoyo; el criterio válido es el del manual y la normativa. Vamos a intentar lo siguiente:<br>1. Actualice el portal con Ctrl + F5 o limpiando la caché.<br>2. Verifique que el navegador no tenga extensiones de bloqueo (AdBlock) activas, o pruebe con otro navegador (Chrome).<br>3. En momentos de alta demanda, el asistente puede tardar unos segundos en responder.<br><br><b>Nota para el agente:</b> si la falla persiste o es reincidente, registre la gestión y escale al equipo técnico con captura e ID de trámite.<br><br>¿El asistente ya responde? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Asistente IA||Demora de inicio": "Lamento el inconveniente. Tomemos en cuenta que el asistente es una herramienta de apoyo; el criterio válido es el del manual y la normativa. Vamos a intentar lo siguiente:<br>1. Actualice el portal con Ctrl + F5 o limpiando la caché.<br>2. Verifique que el navegador no tenga extensiones de bloqueo (AdBlock) activas, o pruebe con otro navegador (Chrome).<br>3. En momentos de alta demanda, el asistente puede tardar unos segundos en responder.<br><br><b>Nota para el agente:</b> si la falla persiste o es reincidente, registre la gestión y escale al equipo técnico con captura e ID de trámite.<br><br>¿El asistente ya responde? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Asistente IA||Conectividad IA": "Lamento el inconveniente. Tomemos en cuenta que el asistente es una herramienta de apoyo; el criterio válido es el del manual y la normativa. Vamos a intentar lo siguiente:<br>1. Actualice el portal con Ctrl + F5 o limpiando la caché.<br>2. Verifique que el navegador no tenga extensiones de bloqueo (AdBlock) activas, o pruebe con otro navegador (Chrome).<br>3. En momentos de alta demanda, el asistente puede tardar unos segundos en responder.<br><br><b>Nota para el agente:</b> si la falla persiste o es reincidente, registre la gestión y escale al equipo técnico con captura e ID de trámite.<br><br>¿El asistente ya responde? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Asistente IA||Explicación incorrecta": "Lamento el inconveniente, con gusto le ayudo. Permítame aclararle el concepto correcto con base en el apartado de Definiciones del manual. Si la conversación se quedó en un bucle, revisemos juntos la respuesta que ingresó para reformularla con mayor claridad.<br><br><b>Nota para el agente:</b> solicite una captura del diálogo y el ID de la interacción, registre la gestión y remítala al equipo de desarrollo para revisar las bases de conocimiento de la IA.<br><br>¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Asistente IA||Respuestas inconsistentes": "Lamento el inconveniente, con gusto le ayudo. Permítame aclararle el concepto correcto con base en el apartado de Definiciones del manual. Si la conversación se quedó en un bucle, revisemos juntos la respuesta que ingresó para reformularla con mayor claridad.<br><br><b>Nota para el agente:</b> solicite una captura del diálogo y el ID de la interacción, registre la gestión y remítala al equipo de desarrollo para revisar las bases de conocimiento de la IA.<br><br>¿Hay algo más en lo que perar contraseña\" con su correo registrado para restablecer el acceso.<br><br><b>Nota para el agente:</b> si el usuario asegura no haberse registrado antes, registre la gestión y escale al equipo técnico con el DUI para su validación.<br><br>¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Registro de usuarios||OTP no recibido": "Con gusto le asisto. Vamos a realizar lo siguiente:<br>1. Revise su bandeja de entrada y también las carpetas de Spam, Promociones o Notificaciones.<br>2. Si el contador en pantalla llegó a cero, seleccione \"Reenviar código\".<br>3. Abra el correo más reciente y digite el código de inmediato, ya que por seguridad caduca en pocos minutos.<br><br><b>Nota para el agente:</b> si el correo es correcto y el código no llega, registre la gestión y escale al equipo técnico por posible retraso en el servidor de correos.<br><br>¿Pudo ingresar el código? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Registro de usuarios||OTP inválido": "Con gusto le asisto. Vamos a realizar lo siguiente:<br>1. Revise su bandeja de entrada y también las carpetas de Spam, Promociones o Notificaciones.<br>2. Si el contador en pantalla llegó a cero, seleccione \"Reenviar código\".<br>3. Abra el correo más reciente y digite el código de inmediato, ya que por seguridad caduca en pocos minutos.<br><br><b>Nota para el agente:</b> si el correo es correcto y el código no llega, registre la gestión y escale al equipo técnico por posible retraso en el servidor de correos.<br><br>¿Pudo ingresar el código? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Registro de usuarios||Creación de contraseña": "Con gusto le indico los criterios. La contraseña debe cumplir: longitud mínima, al menos una mayúscula, una minúscula, un número y un símbolo especial; y ambos campos de confirmación deben coincidir exactamente.<br><br>¿Pudo crear su contraseña? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Gestión de entidades||Entidad bloqueada por falta de confirmación (48 h)": "Con gusto le asisto. Según el caso:<br>1. Si un invitado no logra vincularse, valide que tenga cuenta creada y confirmada y que el correo esté bien escrito; reenvíe la invitación desde \"Gestión de roles\".<br>2. Si el sistema indica que el usuario o la entidad ya existen, oriente a usar el acceso existente o a solicitar el rol al administrador.<br>3. Si la entidad quedó bloqueada, recuerde que el enlace de confirmación expira en 48 horas; revise Spam y valide el correo.<br><br><b>Nota para el agente:</b> si persiste el error de vinculación, la creación falla por sistema, o la entidad sigue bloqueada, registre la gestión con el NIT y el correo, y escale al equipo técnico para el reenvío o la activación.<br><br>¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Gestión de entidades||Correo de confirmación de entidad no recibido": "Con gusto le asisto. Según el caso:<br>1. Si un invitado no logra vincularse, valide que tenga cuenta creada y confirmada y que el correo esté bien escrito; reenvíe la invitación desde \"Gestión de roles\".<br>2. Si el sistema indica que el usuario o la entidad ya existen, oriente a usar el acceso existente o a solicitar el rol al administrador.<br>3. Si la entidad quedó bloqueada, recuerde que el enlace de confirmación expira en 48 horas; revise Spam y valide el correo.<br><br><b>Nota para el agente:</b> si persiste el error de vinculación, la creación falla por sistema, o la entidad sigue bloqueada, registre la gestión con el NIT y el correo, y escale al equipo técnico para el reenvío o la activación.<br><br>¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Geolocalización (ISA)||Error al validar la geolocalización": "Con mucho gusto le asisto. Según la opción que utilice:<br>1. Coordenadas: ingréselas en el formato requerido, separadas por comas.<br>2. Archivo KML: verifique que sea válido y no exceda 10 MB; puede comprobarlo en Google Earth.<br>3. Mapa interactivo: si no carga o no le permite dibujar, recargue con Ctrl + F5, limpie la caché o pruebe otro navegador (Chrome).<br>4. Marque la casilla de confirmación y presione \"Validar\".<br><br><b>Nota para el agente:</b> si la validación no procesa, registre la gestión con el ID de trámite y captura, y escale al equipo técnico.<br><br>¿Pudo validar la geolocalización? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Geolocalización (ISA)||KML no carga o formato inválido": "Con mucho gusto le asisto. Según la opción que utilice:<br>1. Coordenadas: ingréselas en el formato requerido, separadas por comas.<br>2. Archivo KML: verifique que sea válido y no exceda 10 MB; puede comprobarlo en Google Earth.<br>3. Mapa interactivo: si no carga o no le permite dibujar, recargue con Ctrl + F5, limpie la caché o pruebe otro navegador (Chrome).<br>4. Marque la casilla de confirmación y presione \"Validar\".<br><br><b>Nota para el agente:</b> si la validación no procesa, registre la gestión con el ID de trámite y captura, y escale al equipo técnico.<br><br>¿Pudo validar la geolocalización? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Geolocalización (ISA)||Coordenadas inválidas": "Con mucho gusto le asisto. Según la opción que utilice:<br>1. Coordenadas: ingréselas en el formato requerido, separadas por comas.<br>2. Archivo KML: verifique que sea válido y no exceda 10 MB; puede comprobarlo en Google Earth.<br>3. Mapa interactivo: si no carga o no le permite dibujar, recargue con Ctrl + F5, limpie la caché o pruebe otro navegador (Chrome).<br>4. Marque la casilla de confirmación y presione \"Validar\".<br><br><b>Nota para el agente:</b> si la validación no procesa, registre la gestión con el ID de trámite y captura, y escale al equipo técnico.<br><br>¿Pudo validar la geolocalización? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Geolocalización (ISA)||Mapa interactivo no carga o no dibuja": "Con mucho gusto le asisto. Según la opción que utilice:<br>1. Coordenadas: ingréselas en el formato requerido, separadas por comas.<br>2. Archivo KML: verifique que sea válido y no exceda 10 MB; puede comprobarlo en Google Earth.<br>3. Mapa interactivo: si no carga o no le permite dibujar, recargue con Ctrl + F5, limpie la caché o pruebe otro navegador (Chrome).<br>4. Marque la casilla de confirmación y presione \"Validar\".<br><br><b>Nota para el agente:</b> si la validación no procesa, registre la gestión con el ID de trámite y captura, y escale al equipo técnico.<br><br>¿Pudo validar la geolocalización? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Envío del trámite||No puede finalizar el trámite": "Con gusto le asisto. Vamos a verificar:<br>1. Confirme que todos los pasos y la documentación requerida estén completos.<br>2. Marque las casillas de términos y condiciones y de declaración jurada.<br>3. Presione \"Finalizar trámite\" y luego \"Enviar a revisión\".<br><br><b>Nota para el agente:</b> si las casillas no se marcan, sugiera recargar (Ctrl + F5) o probar otro navegador. Si aun así no finaliza o no envía, registre la gestión con el ID de trámite y captura, y escale al equipo técnico.<br><br>¿Pudo enviar su trámite? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Envío del trámite||No puede enviar a revisión": "Con gusto le asisto. Vamos a verificar:<br>1. Confirme que todos los pasos y la documentación requerida estén completos.<br>2. Marque las casillas de términos y condiciones y de declaración jurada.<br>3. Presione \"Finalizar trámite\" y luego \"Enviar a revisión\".<br><br><b>Nota para el agente:</b> si las casillas no se marcan, sugiera recargar (Ctrl + F5) o probar otro navegador. Si aun así no finaliza o no envía, registre la gestión con el ID de trámite y captura, y escale al equipo técnico.<br><br>¿Pudo enviar su trámite? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Envío del trámite||Casillas de términos o juramento no se marcan": "Con gusto le asisto. Vamos a verificar:<br>1. Confirme que todos los pasos y la documentación requerida estén completos.<br>2. Marque las casillas de términos y condiciones y de declaración jurada.<br>3. Presione \"Finalizar trámite\" y luego \"Enviar a revisión\".<br><br><b>Nota para el agente:</b> si las casillas no se marcan, sugiera recargar (Ctrl + F5) o probar otro navegador. Si aun así no finaliza o no envía, registre la gestión con el ID de trámite y captura, y escale al equipo técnico.<br><br>¿Pudo enviar su trámite? ¿Hay algo más en lo que pueda asistir?", "Incidentes Portal de Trámites||Seguimiento del trámite||No visualiza el estado o el historial del trámite": "Con gusto le oriento.<br>1. Recargue la página y valide que el trámite haya sido enviado.<br>2. Ingrese a \"Mis trámites\", seleccione el menú de tres puntos y elija \"Ver detalles\" para revisar Detalles, Carga de documentos e Historial.<br><br><b>Nota para el agente:</b> si la información no aparece, registre la gestión con el ID de trámite y captura, y escale al equipo técnico.<br><br>¿Hay algo más en lo que pueda asistir?", "Consultas||Roles||Permisos requeridos": "Con gusto le explico. Los permisos dependen del rol asignado: el <b>Administrador</b> gestiona la entidad, los usuarios vinculados y los roles; el <b>Tramitador</b> gestiona los trámites según lo que el administrador le habilite. Si una opción no le aparece, por lo general es porque su rol no tiene ese permiso; en ese caso debe solicitarlo al administrador de su entidad.<br><br>¿Hay algo más en lo que pueda asistir?", "Consultas||Entidad||Representantes legales autorizados para crear entidad": "Con gusto le oriento. La entidad la registra el <b>titular o el representante legal</b>. El rol de administrador principal queda enlazado al representante legal vigente, que el sistema valida en tiempo real contra el CNR. El consultor o tramitador no registra la entidad: es el administrador quien lo invita a colaborar.<br><br><b>Nota para el agente:</b> si hubo cambio de representante legal, primero debe actualizarse en el CNR antes de registrar o transferir la administración.<br><br>¿Hay algo más en lo que pueda asistir?", "Consultas||Documentación||Formato de archivos permitido": "Con gusto le indico. La plataforma admite archivos en formato <b>.jpg, .pdf y .docx</b>, con un tamaño máximo de <b>10 MB</b> por archivo. Si su documento pesa más, puede comprimirlo o dividirlo antes de cargarlo.<br><br>¿Hay algo más en lo que pueda asistir?"};   // capa de guiones (override por "Tip1||Tip2||Tip3"); editable sin tocar la estructura
DATA.forEach((d,i)=>d.id=i);
const cls = t => t==='Consulta'?'consulta':(t==='Gestión'?'gestion':'incidencia');
const keyOf = d => `${d.t1}||${d.t2}||${d.t3}`;
const guionDe = d => GUIONES[keyOf(d)] || d.resol;

const APERTURA = `<b>Saludo:</b> "Gracias por contactar al Centro de Soporte del Sistema de Evaluación Ambiental. Le saluda [agente]. ¿Con quién tengo el gusto?… Un placer, [usuario]. ¿Cómo le podemos asistir?"<br><br><b>Verificación (si se hablará de su cuenta):</b> "Para poder ayudarle, ¿me confirma el correo registrado y el nombre de la entidad o el NIT?"`;
const APERTURA_NOTE = "Datos base en toda llamada: nombre · rol en la entidad · NIT · (DUI / correo / ID de trámite si aplica). El agente NUNCA solicita la contraseña.";
const CIERRE = `"Su gestión queda registrada bajo el número [XXXX]. ¿Hay algo más en lo que pueda asistirle?… Muchas gracias por contactar al Centro de Soporte del Sistema de Evaluación Ambiental. Le atendió [agente]. Que tenga un excelente día."`;
const ESCAL = `<b>Regla al escalar:</b> si el caso no se resuelve en la llamada, NO se cierra como Consulta. Se registra como <b>Incidencia</b> (si hay un malfuncionamiento del sistema) o como <b>Gestión</b> (si requiere una acción y no es un malfuncionamiento).<br><br><b>Pasos:</b><br>1. Capturar evidencia: pasos realizados, mensaje o captura del error, datos del usuario y de la entidad.<br>2. Reclasificar y tipificar el caso (ver "Cómo tipificar").<br>3. Registrar todo en el campo de resolución de SDP y generar el número de gestión.<br>4. Informar al usuario el número de gestión y el seguimiento.<br><br><b>Niveles:</b> N1 (Call Center) resuelve y filtra → N2 (TI Aplicaciones / Infraestructura) → N3 (Plataforma). El cambio de categoría lo resuelve la coordinación técnica del MARN.`;
function theme(t2){
  const s=(t2||'').toLowerCase();
  if(s.includes('georref')||s.includes('geolocal')) return 'geo';
  if(s.includes('categoriz')) return 'categorizacion';
  if(s.includes('asistente ia')) return 'ia';
  if(s.includes('document')) return 'documentos';
  if(s.includes('rol')) return 'roles';
  if(s.includes('entidad')||s.includes('integracion')||s.includes('cnr')||s.includes('rnpn')) return 'entidad';
  if(s.includes('acceso')||s.includes('autentic')||s.includes('registro')||s.includes('cuenta')) return 'acceso';
  if(s.includes('tramite')||s.includes('envio')||s.includes('seguimiento')) return 'tramite';
  if(s.includes('datos')) return 'datos';
  return '';
}
const ORD={Incidencia:0,'Gestión':1,Consulta:2};
function relatedCases(d){
  const t=theme(d.t2);
  let pool;
  if(t){ pool=DATA.filter(x=>x.id!==d.id && x.tipo!=='Consulta' && theme(x.t2)===t); }
  else {
    const norm=s=>(s||'').toLowerCase();
    const STOP=new Set(['para','con','los','las','del','una','que','por','como','sobre','usuario','tramite','sistema','plataforma','correo','datos','desde','este','esta','sus','app']);
    const roots=[...new Set(norm(d.t2+' '+d.t3).split(/[^a-záéíóúñ]+/).filter(w=>w.length>=4&&!STOP.has(w)))].map(w=>w.slice(0,5));
    pool=DATA.filter(x=>x.id!==d.id&&x.tipo!=='Consulta').map(x=>{const hay=norm(x.t2+' '+x.t3+' '+x.caso);let s=0;roots.forEach(r=>{if(hay.includes(r))s++;});return{x,s};}).filter(o=>o.s>0).sort((a,b)=>b.s-a.s).map(o=>o.x);
  }
  return pool.sort((a,b)=>ORD[a.tipo]-ORD[b.tipo]).slice(0,6);
}
function reglaNota(d){
  if(d.tipo==='Consulta') return `<div class="note" style="margin-top:0"><b>Reclasifique según lo que reporta:</b> una consulta que no se resuelve no se cierra como consulta. Conviértala en <b>Incidencia</b> si hay un malfuncionamiento del sistema, o en <b>Gestión</b> si requiere una acción y no es un malfuncionamiento. Use los casos sugeridos para ir a la pantalla correcta.</div>`;
  if(d.tipo==='Gestión') return `<div class="note" style="margin-top:0">No es un malfuncionamiento: manténgala como <b>Gestión</b> y escale al área correspondiente.</div>`;
  return `<div class="note" style="margin-top:0">Es un malfuncionamiento: regístrela como <b>Incidencia</b> y escale a TI con la evidencia.</div>`;
}
function openEscal(d){
  const rel = d.tipo==='Consulta' ? relatedCases(d) : [];
  let relHTML='';
  if(rel.length){
    relHTML = `<div class="guion" style="box-shadow:none;padding:0;margin-top:14px"><div class="lbl">Ir al caso correspondiente (según lo que reporta)</div></div>`+
      rel.map(x=>`<div class="res" data-leaf="${x.id}"><div class="rt"><span class="chip ${cls(x.tipo)}" style="margin-right:6px">${esc(x.tipo)}</span>${esc(x.t3||x.t2)}</div><div class="rc">${esc(x.t1)} › ${esc(x.t2)}</div></div>`).join('');
  }
  const html = reglaNota(d) + relHTML + '<br>' + ESCAL + '<br><br>Recuerde tipificar con la ruta correcta y entregar el número de gestión.';
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal"><button class="mx">×</button><h3>No se resolvió · reclasificar y escalar</h3><div class="txt">${html}</div></div>`;
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.classList.contains('mx'))ov.remove();});
  ov.querySelectorAll('[data-leaf]').forEach(e=>e.onclick=()=>{ov.remove();go({s:'leaf',id:+e.dataset.leaf});});
  document.body.appendChild(ov);
}
