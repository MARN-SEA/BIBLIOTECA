      <div class="logo-badge">SEA</div>
      <div class="sub">Canal telefónico</div>
      <h1>Biblioteca de Atención<br>Centro de Soporte SEA / MARN</h1>
      <p>Guía interactiva: la llamada inicia en el saludo y se ramifica según lo que necesita el usuario, hasta indicarle cómo tipificar en SDP.</p>
      <button class="btn-start" id="start">Iniciar llamada</button>
    </div>`;
    document.getElementById('start').onclick=()=>{stack=[{s:'saludo'}];render();};
    return;
  }
  top.style.display='flex';

  if(st.s==='hub'){
    title='Inicio';
    html=`<p class="lead">Inicie la atención en el <b>saludo</b> (flujo guiado), o vaya directo a algo específico.</p>
      <div class="grid g1"><div class="card" data-go="saludo" style="border-left-color:var(--navy)"><div class="ct">▶ Iniciar atención (saludo)</div><div class="cd">Comienza el flujo guiado de la llamada y se ramifica desde ahí.</div></div></div>
      <div class="subhdr">Ir directo · por tipo de gestión</div>
      <div class="grid g3">
        <div class="card consulta" data-tipo="Consulta"><div class="ct">Consulta</div><div class="cd">${DATA.filter(d=>d.tipo==='Consulta').length} casos</div></div>
        <div class="card gestion" data-tipo="Gestión"><div class="ct">Gestión</div><div class="cd">${DATA.filter(d=>d.tipo==='Gestión').length} casos</div></div>
        <div class="card incidencia" data-tipo="Incidencia"><div class="ct">Incidencia</div><div class="cd">${DATA.filter(d=>d.tipo==='Incidencia').length} casos</div></div>
      </div>
      <div class="subhdr">Herramientas</div>
      <div class="grid">
        <div class="card tool" data-go="buscar"><div class="ct">🔎 Buscar tipificación</div><div class="cd">Por palabra clave o contexto.</div></div>
        <div class="card tool" data-go="trans"><div class="ct">Situaciones y escalamiento</div><div class="cd">Desescalada, límite y SDP.</div></div>
        <div class="card tool" data-go="cierre"><div class="ct">Cierre de llamada</div><div class="cd">Despedida y número de gestión.</div></div>
        <div class="card tool" data-go="apoyo"><div class="ct">Material de apoyo</div><div class="cd">Matriz, guiones, brochure y flujos.</div></div>
      </div>`;
  }
  else if(st.s==='saludo'){
    title='1 · Saludo';
    html=`<div class="crumb">Inicio de la llamada</div>
      <div class="guion"><div class="lbl">Guion de apertura</div><div class="txt">${APERTURA}</div></div>
      <div class="note">${APERTURA_NOTE}</div>
      <button class="btn-next" id="next">Continuar a la atención →</button>`;
  }
  else if(st.s==='triage'){
    title='¿Qué necesita el usuario?';
    html=`<p class="lead">Escuche y defina el <b>tipo de gestión</b>. De aquí parte toda la ramificación.</p>
      <div class="grid g3">
        <div class="card big consulta" data-tipo="Consulta"><div class="ct">Consulta</div><div class="q">"¿Me pide que le explique algo?"</div><div class="cd">${DATA.filter(d=>d.tipo==='Consulta').length} casos</div></div>
        <div class="card big gestion" data-tipo="Gestión"><div class="ct">Gestión</div><div class="q">"¿Me pide hacer o cambiar algo?"</div><div class="cd">${DATA.filter(d=>d.tipo==='Gestión').length} casos</div></div>
        <div class="card big incidencia" data-tipo="Incidencia"><div class="ct">Incidencia</div><div class="q">"¿Me reporta que algo falla?"</div><div class="cd">${DATA.filter(d=>d.tipo==='Incidencia').length} casos</div></div>
      </div>
      <div class="subhdr">Herramientas de apoyo</div>
      <div class="grid">
        <div class="card tool" data-go="buscar"><div class="ct">🔎 Buscar tipificación</div><div class="cd">Por palabra clave o contexto.</div></div>
        <div class="card tool" data-go="trans"><div class="ct">Situaciones y escalamiento</div><div class="cd">Desescalada, límite institucional y SDP.</div></div>
        <div class="card tool" data-go="cierre"><div class="ct">Cierre de llamada</div><div class="cd">Despedida y número de gestión.</div></div>
        <div class="card tool" data-go="apoyo"><div class="ct">Material de apoyo</div><div class="cd">Matriz, guiones, brochure y flujos.</div></div>
      </div>`;
  }
  else if(st.s==='tipo'){
    title=st.tipo;
    html=`<div class="crumb">Saludo › ¿Qué necesita? › ${esc(st.tipo)}</div><span class="chip ${cls(st.tipo)}">${esc(st.tipo)}</span><p class="lead" style="margin-top:8px">Elija la familia del caso:</p><div class="grid">`+
      familias(st.tipo).map(f=>`<div class="card ${cls(st.tipo)}" data-fam="${esc(f)}"><div class="ct">${esc(f)}</div><div class="cd">${temas(st.tipo,f).length} subcategorías</div></div>`).join('')+`</div>`;
  }
  else if(st.s==='fam'){
    title=st.t1;
    html=`<div class="crumb">${esc(st.tipo)} › ${esc(st.t1)}</div><p class="lead">Elija el tema:</p><div class="grid">`+
      temas(st.tipo,st.t1).map(t=>`<div class="card ${cls(st.tipo)}" data-t2="${esc(t)}"><div class="ct">${esc(t)}</div><div class="cd">${casos(st.tipo,st.t1,t).length} caso(s)</div></div>`).join('')+`</div>`;
  }
  else if(st.s==='t2'){
    title=st.t2;
    html=`<div class="crumb">${esc(st.tipo)} › ${esc(st.t1)} › ${esc(st.t2)}</div><p class="lead">Elija el caso específico:</p><div class="grid g1">`+
      casos(st.tipo,st.t1,st.t2).map(d=>`<div class="card ${cls(st.tipo)}" data-leaf="${d.id}"><div class="ct">${esc(d.t3||st.t2)}</div><div class="cd">${esc((d.caso||'').slice(0,90))}</div></div>`).join('')+`</div>`;
  }
  else if(st.s==='leaf'){ title='Caso'; html=leafHTML(DATA[st.id]); }
  else if(st.s==='buscar'){
    title='Buscar';
    html=`<input class="search-in" id="q" placeholder="Escriba lo que dice el usuario: OTP, entidad, mapa, no me llega…" autofocus>
      <div class="hint">Busca en temas, casos de uso y resoluciones de las ${DATA.length} tipificaciones.</div>
      <div id="results"></div>`;
  }
  else if(st.s==='trans'){
    title='Situaciones y escalamiento';
    html=`<div class="grid g1">
      <div class="card" data-mod="lim"><div class="ct">El límite institucional</div><div class="cd">Qué sí explico y qué no opino.</div></div>
      <div class="card" data-mod="esc"><div class="ct">Escalamiento y registro en SDP</div><div class="cd">Qué capturar y cómo escalar.</div></div>`+
      SITUACIONES.map((s,i)=>`<div class="card" data-sit="${i}"><div class="ct">${esc(s.t)}</div></div>`).join('')+`</div>`;
  }
  else if(st.s==='cierre'){ title='Cierre'; html=`<div class="guion"><div class="lbl">Guion de cierre</div><div class="txt">${CIERRE}</div></div>`; }
  else if(st.s==='apoyo'){
    title='Material de apoyo';
    html=`<div class="grid g1">
      <a class="card" href="${LINKS.matriz}" target="_blank"><div class="ct">📊 Matriz de tipificaciones</div><div class="cd">Google Sheet · catálogo completo.</div></a>
      <a class="card" href="${LINKS.guiones}" target="_blank"><div class="ct">📝 Guiones de atención</div><div class="cd">Google Doc · scripts por situación.</div></a>
      <div class="card" data-mod="apoyo"><div class="ct">📖 Brochure y flujos de soporte</div><div class="cd">Disponibles en la carpeta compartida del proyecto.</div></div>
    </div>`;
  }

  document.getElementById('title').textContent=title;
  c.innerHTML=html;

  if(st.s==='saludo') document.getElementById('next').onclick=()=>go({s:'triage'});
  c.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go({s:e.dataset.go}));
  c.querySelectorAll('[data-tipo]').forEach(e=>e.onclick=()=>chooseTipo(e.dataset.tipo));
  c.querySelectorAll('[data-fam]').forEach(e=>e.onclick=()=>go({s:'fam',tipo:st.tipo,t1:e.dataset.fam}));
  c.querySelectorAll('[data-t2]').forEach(e=>e.onclick=()=>go({s:'t2',tipo:st.tipo,t1:st.t1,t2:e.dataset.t2}));
  c.querySelectorAll('[data-leaf]').forEach(e=>e.onclick=()=>go({s:'leaf',id:+e.dataset.leaf}));
  c.querySelectorAll('[data-sit]').forEach(e=>e.onclick=()=>{const s=SITUACIONES[+e.dataset.sit];modal(s.t,s.x);});
  c.querySelectorAll('[data-mod]').forEach(e=>e.onclick=()=>{
    const m=e.dataset.mod;
    if(m==='lim')modal('El límite institucional',LIMITE);
    else if(m==='esc')modal('Escalamiento y registro en SDP',ESCAL);
    else if(m==='apoyo')modal('Brochure y flujos','El <b>Manual de Usuario Externo (brochure)</b> y el <b>Flujo de soporte</b> están en la carpeta compartida del proyecto. Úselos como material de consulta; no forman parte del flujo de la llamada.');
  });
  if(st.s==='leaf'){
    document.getElementById('dy').onclick=()=>modal('Se resolvió · cierre',CIERRE);
    document.getElementById('dn').onclick=()=>openEscal(DATA[st.id]);
  }
  if(st.s==='buscar'){
    const q=document.getElementById('q'), res=document.getElementById('results');
    const run=()=>{
      const v=q.value.trim().toLowerCase();
      if(v.length<2){res.innerHTML='';return;}
      const hits=DATA.filter(d=>(d.t2+' '+d.t3+' '+d.caso+' '+d.resol+' '+d.t1).toLowerCase().includes(v)).slice(0,40);
      res.innerHTML = hits.length? hits.map(d=>`<div class="res" data-leaf="${d.id}"><div class="rt"><span class="chip ${cls(d.tipo)}" style="margin-right:6px">${esc(d.tipo)}</span>${esc(d.t3||d.t2)}</div><div class="rc">${esc(d.t1)} › ${esc(d.t2)}</div></div>`).join('') : '<div class="hint">Sin coincidencias. Pruebe otra palabra clave.</div>';
      res.querySelectorAll('[data-leaf]').forEach(e=>e.onclick=()=>go({s:'leaf',id:+e.dataset.leaf}));
    };
    q.oninput=run;
  }
}
document.getElementById('bHome').onclick=home;
document.getElementById('bBack').onclick=back;
document.getElementById('bSearch').onclick=()=>go({s:'buscar'});
render();
</script>
</body>
</html>
